<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

       y el que aparece en los resultados de búsqueda. -->

    <meta name="description" content="Resumen del sitio en una sola línea.">

    <!-- La hoja de estilos se trabaja a partir de la sesión 3. -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- Un solo h1 por página. Aquí va su nombre o el título del sitio. -->
    <h1>CONTACTO DE CARLOS BONILLA</h1>
    <H2>CURSO DESARROLLO WEB</H2>

    <!-- El contenido de la sesión 1 se escribe a partir de aquí:
       párrafos, encabezados h2, listas, enlaces e imágenes.
       Las imágenes van en la carpeta img y se llaman así:
       <img src="img/perfil.jpg" alt="Descripción de la imagen"> -->
    <header>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="CONTACTOS.HTML">CONTACTO</a>
            <a href="PERFIL.HTML">PERFIL</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>CONTACTO</h2>
            <p>FORMULARIO DE CONTACTO.</p>
            <!-- INSERTAR FORMULARIO DE CONTACTO AQUÍ -->
            <form action="#" method="post">
  <label for="nombre">Nombre:</label><br>
  <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre completo" required><br><br>

  <label for="email">Correo electrónico:</label><br>
  <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required><br><br>

  <label for="asunto">Asunto:</label><br>
  <input type="text" id="asunto" name="asunto" placeholder="Motivo de tu mensaje"><br><br>

  <label for="mensaje">Mensaje:</label><br>
  <textarea id="mensaje" name="mensaje" rows="4" cols="50" placeholder="Escribe tu mensaje aquí..." required></textarea><br><br>

  <button type="submit">Enviar</button>
</form>

        </section>
    </main>

    <footer>
        <p>2026 BEC</p>
    </footer>
</body>


<!-- El JavaScript se trabaja a partir de la sesión 4. -->
<script src="js/scripts.js"></script>
