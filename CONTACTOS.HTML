<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAGINA DESARROLLO WEB</title>
    <meta name="description" content="Contacto de Carlos Bonilla">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <h1>CONTACTO DE CARLOS BONILLA</h1>
    <h2>CURSO DESARROLLO WEB</h2>

    <header>
        <nav>
            <a href="index.html">INICIO</a>
            <a href="CONTACTOS.HTML">CONTACTO</a>
            <a href="PERFIL.HTML">PERFIL</a>
        </nav>
    </header>

    <main>
        <section class="contenedor-formulario">
            <h2>CONTACTO</h2>
            <p style="text-align: center; color: #666;">Envíame un mensaje y me pondré en contacto contigo a la brevedad.</p>
            
            <!-- MENSAJE DE ÉXITO -->
            <p id="mensaje-exito" class="exito oculto"></p>

            <!-- FORMULARIO DE CONTACTO -->
            <form id="contacto" novalidate>
                <div class="campo-grupo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Carlos Bonilla">
                    <p class="error" id="error-nombre"></p>
                </div>

                <div class="campo-grupo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com">
                    <p class="error" id="error-correo"></p>
                </div>

                <div class="campo-grupo">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..."></textarea>
                    <p class="error" id="error-mensaje"></p>
                </div>

                <!-- PREGUNTA MATEMÁTICA ANTI-BOT -->
                <div class="campo-grupo">
                    <label for="captcha-math">Control de seguridad: ¿Cuánto es 3 + 4?</label>
                    <input type="number" id="captcha-math" name="captcha-math" placeholder="Escribe el resultado">
                    <p class="error" id="error-captcha"></p>
                </div>

                <div style="text-align: center;">
                    <button type="submit" class="btn-enviar">Enviar Mensaje</button>
                </div>
            </form>
        </section>
    </main>
    
    <footer>
        <p>2026 BEC</p>
    </footer>

    <script src="js/scripts.js"></script>
</body>

</html>
